name: wishkit
description: WishKit Flutter SDK - Collect user feedback and feature requests in your app.
version: 1.0.0
homepage: https://github.com/wishkit/wishkit-flutter
repository: https://github.com/wishkit/wishkit-flutter
issue_tracker: https://github.com/wishkit/wishkit-flutter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0'
  http: ^1.1.0
  meta: ^1.10.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  uuid: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # Generates `WishKitLocalizations` from the 17 ARB bundles in `lib/l10n`.
  # Consumers need no extra setup: the generated file is committed as well, so
  # the SDK builds even when a host app opts out of `gen-l10n`.
  generate: true
